name: Keep Supabase awake

# Supabase pauses a Free-plan project after a week of low database activity,
# and a paused project takes sign-in, saved-film sync and (from the verse of
# the day) every film in the app down with it. This reads the database twice
# a day so the project never looks idle. Upgrading to Pro removes the need:
# paid projects are never paused.
#
# The key is the public anon key the app and the website already ship; the
# reads return no rows (row-level security), they only have to reach Postgres.
# If the project is down anyway, the run fails and GitHub emails the owner.
#
# GitHub turns off scheduled workflows in a public repo after 60 days with no
# activity in it; Actions > this workflow > Enable turns it back on.

on:
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://ulmptivzgvcpbygpkkfv.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsbXB0aXZ6Z3ZjcGJ5Z3Bra2Z2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NDIzMTUsImV4cCI6MjEwODAxODMxNX0.hhuxSbEAZuFiNMlcy_DaZZUOeGUnsPVnjj1Vkb5fKZM
    steps:
      - name: Query the database
        run: |
          get() {
            curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 --retry-all-errors \
              "$SUPABASE_URL/$1" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          }
          library=$(get "rest/v1/library?select=user_id&limit=1")
          films=$(get "rest/v1/films?select=id&limit=1")
          echo "library: $library  films: $films"
          # The library table has been there since launch; films only once its
          # migration is applied, so only the library has to answer.
          test "$library" = 200
